name: SupplyHQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript
        run: |
          node --check api-client.js
          node --check app.js
          node --check account.js
          node --check dashboard.js
          node --check procurement.js
          node --check admin.js

      - name: Check Worker module
        run: |
          cp worker/src/index.js /tmp/supplyhq-worker.mjs
          node --check /tmp/supplyhq-worker.mjs
