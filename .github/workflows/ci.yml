name: SupplyHQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript
        run: |
          node --check api-client.js
          node --check app.js
          node --check account.js
          node --check dashboard.js
          node --check procurement.js
          node --check admin.js
          node --check phones-catalog.js
          node --check phones.js
          node --check sw.js
          node --check seller.js
          node --check stores.js
          node --check store.js
          node --check ai-studio.js
          node scripts/validate-agent-studio.cjs
          node scripts/validate-multivendor.cjs
          node scripts/validate-phones-catalog.cjs
          node scripts/build-cloudflare-pages.cjs
          test -f dist/index.html
          test -f dist/ai.html
          test -f dist/worker/src/agent-core.js
          test ! -f dist/CNAME
          test ! -f dist/worker/src/index.js

      - name: Check Worker module
        run: |
          node --check worker/src/index.js
          node --check worker/src/marketplace.js
          node --check worker/src/agent-core.js
          node --check worker/src/agent-api.js
